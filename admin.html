<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>yousef clothes — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#eef3ff;--card:#ffffff;--border2:rgba(31,41,64,.18);--accent:#6c63ff;--text:#1e2740;--muted:#63708a;--err:#f87171;--input:#f7f9ff}
    html,body{min-height:100%;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);display:grid;place-items:center;padding:1rem}
    .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:1rem}
    h1{font-size:1.25rem;margin-bottom:.35rem}
    p{font-size:13px;color:var(--muted);margin-bottom:.8rem}
    input{width:100%;height:44px;border:1px solid var(--border2);background:var(--input);color:var(--text);border-radius:10px;padding:0 .7rem;font-family:inherit}
    button{width:100%;height:44px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;font-weight:700;margin-top:.65rem;cursor:pointer}
    .msg{margin-top:.6rem;font-size:13px;color:var(--err)}
    .back{display:inline-block;margin-top:.8rem;color:#4f5e7a;text-decoration:none;font-size:13px}
  </style>
</head>
<body>
  <section class="card">
    <h1>دخول الأدمن</h1>
    <p>ادخل كلمة مرور الأدمن للوصول إلى لوحة إدارة المنتجات والطلبات.</p>
    <form id="admin-form" novalidate>
      <input id="admin-password" type="password" placeholder="كلمة مرور الأدمن" required/>
      <button type="submit">دخول</button>
      <div class="msg" id="msg"></div>
    </form>
    <a class="back" href="/dashboard.html">← الرجوع للمنتجات</a>
  </section>

  <script>
    const form = document.getElementById("admin-form");
    const msg = document.getElementById("msg");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("admin-password").value.trim();
      if(!password){ msg.textContent = "من فضلك ادخل كلمة المرور."; return; }
      msg.textContent = "جاري التحقق...";
      try {
        const res = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if(!res.ok || !data.success){
          msg.textContent = data.message || "كلمة المرور غير صحيحة.";
          return;
        }
        sessionStorage.setItem("adminKey", data.adminKey);
        window.location.href = "/admin-dashboard.html";
      } catch {
        msg.textContent = "تعذر الاتصال بالخادم.";
      }
    });
  </script>
</body>
</html>
