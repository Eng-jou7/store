<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>yousef clothes — المنتجات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#eef3ff;
      --card:#ffffff;
      --border:rgba(31,41,64,0.10);
      --border2:rgba(31,41,64,0.18);
      --accent:#6c63ff;
      --accent2:#a78bfa;
      --text:#1e2740;
      --muted:#63708a;
      --input-bg:#f7f9ff;
    }
    html,body{min-height:100%;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text)}
    .bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.18;animation:float 12s ease-in-out infinite}
    .orb1{width:500px;height:500px;background:#6c63ff;top:-100px;left:-100px}
    .orb2{width:400px;height:400px;background:#a78bfa;bottom:-80px;right:-80px;animation-delay:-4s}
    @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-18px) scale(1.04)}}

    .app{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:2rem 1.25rem 2.5rem}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.25rem}
    .brand{display:flex;align-items:center;gap:10px}
    .brand-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center}
    .brand-logo svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .brand-name{font-size:18px;font-weight:600}
    .meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:.6rem}

    .hero{background:rgba(255,255,255,0.03);border:1px solid var(--border2);border-radius:20px;padding:1.5rem;margin-bottom:1rem}
    .hero h1{font-size:clamp(1.5rem,3vw,2rem);margin-bottom:.4rem}
    .hero p{font-size:14px;color:var(--muted)}

    .toolbar{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0 1.2rem}
    .tab{border:1px solid var(--border2);background:var(--input-bg);color:var(--muted);padding:.5rem .85rem;border-radius:999px;font-size:12px;cursor:pointer;transition:.2s}
    .tab.active{color:#fff;background:linear-gradient(135deg,var(--accent),#8b5cf6);border-color:transparent}

    .products-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:1rem;
    }
    .product-card{
      background:var(--card);
      border:1px solid var(--border2);
      border-radius:16px;
      overflow:hidden;
      cursor:pointer;
      transition:transform .2s,border-color .2s,box-shadow .2s;
      animation:fadeIn .45s ease both;
    }
    .product-card:hover{transform:translateY(-4px);border-color:rgba(167,139,250,.45);box-shadow:0 16px 34px rgba(0,0,0,.35)}
    .product-media{
      height:140px;
      background:
        linear-gradient(135deg,rgba(108,99,255,.18),rgba(167,139,250,.08)),
        repeating-linear-gradient(-45deg,rgba(255,255,255,.04),rgba(255,255,255,.04) 8px,transparent 8px,transparent 16px);
      border-bottom:1px solid var(--border);
      position:relative;
    }
    .product-media::after{
      content:"";
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      font-size:12px;
      letter-spacing:.04em;
      text-transform:uppercase;
    }
    .product-media img{width:100%;height:100%;object-fit:cover;display:block}
    .product-body{padding:.9rem}
    .product-title{font-size:14px;font-weight:600;margin-bottom:.3rem}
    .product-sub{font-size:12px;color:var(--muted);margin-bottom:.8rem}
    .slot-row{display:flex;gap:.45rem}
    .slot{flex:1;height:9px;border-radius:99px;background:rgba(255,255,255,.07)}

    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 7a4 4 0 1 1 8 0"/>
            <path d="M4 10h16l-2 10H6L4 10z"/>
            <path d="M9.5 7h5"/>
          </svg>
        </div>
        <span class="brand-name" id="brand-secret-trigger">yousef clothes</span>
      </div>
      <div class="meta">
        <span>المنتجات</span>
      </div>
    </header>

    <section class="hero">
      <h1>تسوق أحدث المنتجات</h1>
      <p>اختر المنتج المناسب واضغط عليه لعرض التفاصيل وطلبه مباشرة.</p>
    </section>

    <div class="toolbar" id="toolbar"></div>

    <main class="products-grid" id="products-grid"></main>
  </div>

  <script>
    const toolbar = document.getElementById('toolbar');
    const grid = document.getElementById('products-grid');
    let currentFilter = 'all';
    let products = [];
    let categories = [];

    function esc(v){
      return String(v ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }

    function render() {
      const filtered = products.filter((p) => currentFilter === 'all' || p.category === currentFilter);
      if (!filtered.length) {
        grid.innerHTML = '<article class="product-card"><div class="product-body"><h3 class="product-title">لا توجد منتجات</h3><p class="product-sub">سيتم إضافة منتجات قريبًا.</p></div></article>';
        return;
      }
      grid.innerHTML = filtered.map((p) => `
        <article class="product-card" data-id="${p._id}">
          <div class="product-media"><img src="${esc(p.imageUrl)}" alt="${esc(p.name)}" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'"/></div>
          <div class="product-body">
            <h3 class="product-title">${esc(p.name)}</h3>
            <p class="product-sub">Price: ${Number(p.price).toFixed(2)} EGP</p>
            <div class="slot-row"><span class="slot"></span><span class="slot"></span><span class="slot"></span></div>
          </div>
        </article>
      `).join('');
    }

    function renderTabs() {
      const list = ['all', ...categories];
      toolbar.innerHTML = list.map((cat) => `
        <button class="tab ${cat === currentFilter ? 'active' : ''}" data-filter="${cat}">
          ${cat === 'all' ? 'الكل' : esc(cat)}
        </button>
      `).join('');
    }

    toolbar.addEventListener('click', (e) => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      currentFilter = tab.dataset.filter;
      renderTabs();
      render();
    });

    grid.addEventListener('click', (e) => {
      const card = e.target.closest('.product-card');
      if (!card?.dataset.id) return;
      window.location.href = `/product.html?id=${card.dataset.id}`;
    });

    (async function loadData() {
      try {
        const [productsRes, categoriesRes] = await Promise.all([
          fetch('/api/products'),
          fetch('/api/categories')
        ]);
        const productsData = await productsRes.json();
        const categoriesData = await categoriesRes.json();
        products = (productsRes.ok && productsData.success && Array.isArray(productsData.products)) ? productsData.products : [];
        categories = (categoriesRes.ok && categoriesData.success && Array.isArray(categoriesData.categories)) ? categoriesData.categories : [];
      } catch {
        products = [];
        categories = [];
      }
      renderTabs();
      render();
    })();

    // Hidden admin shortcuts:
    // 1) Desktop: Ctrl + Shift + A
    // 2) Mobile/Desktop: tap brand name 5 times quickly
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
        window.location.href = '/admin.html';
      }
    });

    const brandTrigger = document.getElementById('brand-secret-trigger');
    let tapCount = 0;
    let tapTimer = null;
    brandTrigger.addEventListener('click', () => {
      tapCount += 1;
      if (tapCount >= 5) {
        window.location.href = '/admin.html';
        tapCount = 0;
        if (tapTimer) clearTimeout(tapTimer);
        tapTimer = null;
        return;
      }
      if (tapTimer) clearTimeout(tapTimer);
      tapTimer = setTimeout(() => {
        tapCount = 0;
        tapTimer = null;
      }, 1800);
    });
  </script>
</body>
</html>
