<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>yousef clothes — Admin Orders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#eef3ff;--card:#ffffff;--border:rgba(31,41,64,.10);--border2:rgba(31,41,64,.18);
      --accent:#6c63ff;--text:#1e2740;--muted:#63708a;--ok:#4ade80;--err:#f87171;--input:#f7f9ff;
    }
    html,body{min-height:100%;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1rem 2rem}
    .top{display:flex;justify-content:space-between;align-items:center;gap:.8rem;margin-bottom:1rem}
    .back{color:#4f5e7a;text-decoration:none;font-size:14px}
    .card{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:1rem}
    .title{font-size:1.2rem;margin-bottom:.8rem}
    .row{display:flex;gap:.6rem;flex-wrap:wrap}
    input{
      flex:1;min-width:220px;height:42px;border-radius:10px;border:1px solid var(--border2);
      background:var(--input);color:var(--text);padding:0 .75rem;font-family:inherit
    }
    button{
      height:42px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),#8b5cf6);
      color:#fff;padding:0 1rem;font-family:inherit;font-weight:700;cursor:pointer
    }
    .msg{margin-top:.7rem;font-size:13px}
    .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
    .table-wrap{margin-top:1rem;overflow:auto;border:1px solid var(--border);border-radius:12px}
    table{width:100%;border-collapse:collapse;min-width:860px}
    th,td{padding:.7rem;border-bottom:1px solid var(--border);text-align:right;font-size:13px;vertical-align:top}
    th{color:#d8d8eb;background:rgba(255,255,255,.02)}
    td{color:#d0d0df}
    .muted{color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="back" href="/admin-dashboard.html">← الرجوع للوحة الأدمن</a>
      <span class="muted">صفحة الطلبات (للأدمن فقط)</span>
    </div>

    <section class="card">
      <h1 class="title">عرض طلبات العملاء</h1>
      <div class="row">
        <button id="load-btn" type="button">تحديث الطلبات</button>
        <button id="logout-btn" type="button" style="background:#2a2d3a">تسجيل خروج الأدمن</button>
      </div>
      <div class="msg" id="msg"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>المنتج</th>
              <th>السعر</th>
              <th>اسم العميل</th>
              <th>الهاتف</th>
              <th>البريد</th>
              <th>العنوان</th>
              <th>التاريخ</th>
            </tr>
          </thead>
          <tbody id="orders-body">
            <tr><td colspan="7" class="muted">جاري تحميل الطلبات...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const msg = document.getElementById("msg");
    const body = document.getElementById("orders-body");
    const loadBtn = document.getElementById("load-btn");
    const logoutBtn = document.getElementById("logout-btn");

    function renderOrders(orders){
      if(!orders.length){
        body.innerHTML = '<tr><td colspan="7" class="muted">لا توجد طلبات حتى الآن.</td></tr>';
        return;
      }
      body.innerHTML = orders.map((o) => `
        <tr>
          <td>${o.productName || "-"}</td>
          <td>${o.price != null ? `${Number(o.price).toFixed(2)} EGP` : "-"}</td>
          <td>${o.name || "-"}</td>
          <td>${o.phone || "-"}</td>
          <td>${o.email || "-"}</td>
          <td>${o.address || "-"}</td>
          <td>${new Date(o.createdAt).toLocaleString("ar-EG")}</td>
        </tr>
      `).join("");
    }

    async function loadOrders() {
      const key = sessionStorage.getItem("adminKey");
      if(!key){ window.location.href = "/admin.html"; return; }
      msg.className = "msg";
      msg.textContent = "جاري التحميل...";
      loadBtn.disabled = true;
      try {
        const res = await fetch("/api/orders", { headers: { "x-admin-key": key } });
        const data = await res.json();
        if(!res.ok || !data.success){
          throw new Error(data.message || "فشل تحميل الطلبات.");
        }
        msg.className = "msg ok";
        msg.textContent = `تم تحميل ${data.orders.length} طلب.`;
        renderOrders(data.orders);
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = err.message || "حدث خطأ.";
        body.innerHTML = '<tr><td colspan="7" class="muted">غير مصرح بالوصول أو حدث خطأ.</td></tr>';
      } finally {
        loadBtn.disabled = false;
      }
    }

    loadBtn.addEventListener("click", loadOrders);
    logoutBtn.addEventListener("click", () => {
      sessionStorage.removeItem("adminKey");
      window.location.href = "/admin.html";
    });
    loadOrders();
  </script>
</body>
</html>
